{% extends "base.html" %}

{% block title %}
Registration
{% endblock %}

{% block content %}

<div class="login-box">
    <h2>Registration Page</h2>

    <form method="POST">

        <div class="form-group">
            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter Username"
                required
            >
        </div>

        <div class="form-group">
            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="Enter Email"
                required
            >
        </div>

        <div class="form-group">
            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >
        </div>

        <button type="submit" class="btn">
            Register
        </button>

    </form>
</div>

{% endblock %}
